name: "Say Hello"
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: "Hello World"
        run: echo "Hello, world!"

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Node"
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      - name: "Lint"
        run: npm run lint

      - name: "Typecheck"
        run: npm run typecheck

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl

      - name: "setup composer"
        uses: php-actions/composer@v6
        continue-on-error: true
        with:
          php_version: "8.3"