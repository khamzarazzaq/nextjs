name: "Say Hello"
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: "Hello World"
        run: echo "Hello, world!"

      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Setup Node"
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      - name: "Lint"
        run: npm run lint

      - name: "Typecheck"
        run: npm run typecheck